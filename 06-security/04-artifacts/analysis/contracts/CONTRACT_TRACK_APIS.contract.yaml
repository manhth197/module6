  - "doc-named content preserved verbatim (both endpoint paths + purpose + note); every [PACK] addition -> changelog rows 23/24"
  - "open owner decisions referenced as parameters (M6-OD-008 revenue, M6-OD-003 hash, M6-OD-012 masking, M6-OD-011 stack); idempotency = LOCKED RULE-005; NO owner value invented (HTTP codes are engineering convention)"
