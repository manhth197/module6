      conversion_event nội bộ') + note ('Nguồn cho measurement outbox') preserved verbatim. [PACK] additions:
      request fields (referencing M6-CTR-007/002/008), response {status,conversion_id,idempotent_replay,
      dispatch_state,correlation_id}, validation_errors (UNKNOWN_EVENT, CONSENT_*, REVENUE_NOT_VERIFIED,
