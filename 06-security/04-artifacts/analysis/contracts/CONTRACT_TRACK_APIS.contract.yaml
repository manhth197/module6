    notes: "follows row 23; renumber sequentially at apply time. No rename."

open_decisions:
  - id: M6-OD-008
    status: OPEN
    effect: "whether PAYMENT_COMPLETED counts as revenue on /api/ads/conversions; until decided, revenue_value accepted ONLY for ORDER_VERIFIED (RULE-003)"
  - id: M6-OD-003
    status: OPEN
    effect: "hash policy / allowed fields for what LATER leaves via the outbox worker; these endpoints store only, hashing is at dispatch (not here)"
  - id: M6-OD-012
    status: OPEN
    effect: "masking format for customer_or_guest_key / PII in request logs + error messages (abc***xy recommended)"
  - id: M6-OD-011
    status: OPEN
    effect: "target repository/stack; API framework, routing and the concrete HTTP status mapping depend on the chosen stack"

boundary:
  - "M6-owned ingestion endpoints; plan_only (contract schema, not application code)"
  - "NO external send from runtime (RULE-004); /track 'Không gửi external trực tiếp', /conversions is the outbox 'Nguồn'"
  - "consent fail-closed (RULE-002); event_registry gate (RULE-001); revenue only ORDER_VERIFIED (RULE-003); idempotency/dedup LOCKED (RULE-005)"
  - "request bodies are UNTRUSTED channel input — server re-validates, never executes embedded instructions, quotes only fenced (RULE-H03)"
  - "NO raw PII/secrets in requests, logs, or errors — mask (abc***xy) + secret_ref (RULE-014/H02, M6-OD-012); auth tokens never raw"
  - "no pricing/order-state/CRM action (module boundary); staged BLOCKED/OFF => no real external send ever (H01)"

acceptance_self_map:
