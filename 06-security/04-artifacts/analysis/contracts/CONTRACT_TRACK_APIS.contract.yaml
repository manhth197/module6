      nội bộ đã qua client/server validation') + note ('Không gửi external trực tiếp') preserved verbatim. [PACK]
      additions: request fields (referencing M6-CTR-004/001/002), response {status,log_id,event_id,
      idempotent_replay,data_quality_status,correlation_id}, validation_errors (UNKNOWN_EVENT, CONSENT_*,
