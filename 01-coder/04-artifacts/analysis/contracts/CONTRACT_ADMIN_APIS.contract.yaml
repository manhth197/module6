open_decisions:
  - id: M6-OD-002
    status: OPEN
    effect: "CPA/ROAS/AOV/Verified-Rate alert thresholds surfaced by the dashboard (M6-CTR-018 thresholds_ref); owner-set, none invented"
  - id: M6-OD-005
    status: OPEN
    effect: "official attribution model; the dashboard may display multiple models (attribution_model filter), scale uses one official model — does not change the endpoint shape"
  - id: M6-OD-006
    status: OPEN
    effect: "owner-approved safe range for guarded auto-publish (M6-CTR-020 publish_state=GUARDED_PUBLISHED). Until decided => NOT_PUBLISHED (fail-closed)"
  - id: M6-OD-012
    status: OPEN
    effect: "masking format for any identity-derived reference in responses/logs/errors (abc***xy recommended)"
  - id: M6-OD-011
    status: OPEN
    effect: "target repository/stack; API framework, routing, access-control implementation and HTTP status mapping depend on the chosen stack"

boundary:
  - "M6-owned admin endpoints; plan_only (contract schema, not application code)"
  - "dashboard is READ-ONLY support view — never triggers an owner action (RULE-012); ROAS from ORDER_VERIFIED (RULE-003)"
  - "scale-requests CREATE a proposal only; owner approval required (RULE-010, L374); endpoint never self-approves (RULE-015)"
  - "learning-candidates review is owner/marketing; NO auto-publish without owner-approved safe range (L375, LEX-006, RULE-011); audience-segment approval stays CRM-owned (M6-CTR-009)"
  - "request bodies UNTRUSTED — server re-validates; NO raw PII/secrets in responses/logs/errors (mask + secret_ref, RULE-H03/RULE-014/H02, M6-OD-012); auth tokens never raw"
  - "all admin endpoints access-controlled (per security design); no pricing/order-state/CRM action (module boundary); staged BLOCKED/OFF => no real scale/publish/send (H01)"

acceptance_self_map:
  - "M6-CTR-018 + M6-CTR-019 + M6-CTR-020 defined field-level (request + response + validation_errors) with types + constraints, referencing already-locked records (CTR-015/013/014) without re-invention"
  - "doc-named content preserved verbatim (all 3 endpoint paths + purpose + note); every [PACK] addition -> changelog rows 25/26/27"
  - "open owner decisions referenced as parameters (M6-OD-002 thresholds, M6-OD-005 attribution model, M6-OD-006 safe range, M6-OD-012 masking, M6-OD-011 stack); NO owner value invented; HTTP codes are engineering convention"
