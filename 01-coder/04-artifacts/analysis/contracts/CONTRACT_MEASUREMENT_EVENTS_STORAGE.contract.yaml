# Physical additions beyond the 20 doc fields — each carries a changelog row.
# ---------------------------------------------------------------------------
row_shape_additions:
  ingested_at:
    type: datetime
    required: true
    kind: "ADDITION [PACK] — physical persistence timestamp (changelog row 18)"
    immutability_zone: A_event_identity_write_once
    note: >
      server-side persistence/append-audit time; DISTINCT from the business event_ts (which is source-supplied
      and may be backdated). Used for append-audit + partitioning. If the owner prefers a single timestamp,
      this addition may be rejected — the 20 doc fields stand regardless.

# ---------------------------------------------------------------------------
storage_keys:
  primary_key: event_id                              # [DOC field] stable event identity
  unique_constraints:
    - idempotency_key                                # RULE-005 idempotency; no double-count (SMK-003)
  indexes:                                           # dashboard/ROAS + audit query paths (over doc fields)
    - event_ts
    - event_code
    - campaign_id
    - adset_id
    - ad_id
    - page_id
    - order_code
    - data_quality_status
    - correlation_id
  partition_candidate: "event_ts or ingested_at (physical; engine + strategy gated by stack M6-OD-011)"

# ---------------------------------------------------------------------------
immutability_zones:
  A_event_identity_write_once:
    fields: [event_id, event_code, event_ts, customer_id, guest_id, page_id, live_session_id,
             campaign_id, adset_id, ad_id, sales_session_id, quote_snapshot_id, consent_snapshot_id,
             currency, idempotency_key, correlation_id, ingested_at]
    rule: >
      immutable after INSERT — the event's identity / consent / trace facts (and the locked constant
      currency=VND) never change (no history rewrite, no hard delete). Identity stitching (guest->customer)
      is recorded in the identity-mapping layer with audit (RULE-006), NEVER by mutating this historical row.
  B_verified_enrichment_set_once:
    fields: [attribution_context, revenue_value, order_code]
    rule: >
      populated by named enrichment workers on the order path. revenue_value ONLY from ORDER_VERIFIED
      (RULE-003). attribution_context is materialized by attribution_materializer (M6-CTR-023) and
      IMMUTABLE after order verified (RULE-008). Verified revenue is NEVER overwritten (M6-CTR-023 duty).
      Any post-verify correction requires an adjustment record {actor, reason, audit, evidence} (RULE-008,
      L242) written to the audit log — NEVER a silent in-place edit.
  C_quality_status_audited:
    fields: [data_quality_status]
    rule: >
      lifecycle PASS|HOLD|FAIL, set/transitioned ONLY by data_quality_checker (M6-CTR-024); every transition
      audited. HOLD/FAIL (and LOW-confidence attribution) rows are NEVER used as scale evidence (RULE-009).

# ---------------------------------------------------------------------------
write_validation:
  allowed_ops:
    - "INSERT: runtime/normalizer appends a row; Zone A fixed at insert; data_quality_status set to its initial value"
    - "UPDATE (Zone B only): attribution_materializer (M6-CTR-023) sets attribution_context / revenue_value / order_code under RULE-003 + RULE-008 (set-once; no verified-revenue overwrite)"
    - "UPDATE (Zone C only): data_quality_checker (M6-CTR-024) transitions data_quality_status (audited)"
  forbidden_ops:
    - "DELETE — no hard delete, no history rewrite"
    - "UPDATE of any Zone A field (event identity / consent / trace are immutable)"
    - "overwrite of a verified revenue_value or a post-verify attribution_context WITHOUT an adjustment record (RULE-008)"
    - "setting revenue_value from anything other than an ORDER_VERIFIED order (RULE-003)"
  invariants:
    - "all 20 doc fields preserved verbatim — names, types, optionality unchanged (DRAFT_LOCKED SPEC §10.1); currency=VND and data_quality_status=[PASS|HOLD|FAIL] verbatim"
    - "PRIMARY KEY event_id; UNIQUE idempotency_key => at-most-once measurement row per event (RULE-005, SMK-003)"
    - "event_code must resolve to an ACTIVE event_registry entry (M6-CTR-003, RULE-001) — gate upstream at ingest"
    - "revenue_value present only alongside an ORDER_VERIFIED order_code (RULE-003)"
    - "no raw PII in logs/evidence: customer_id / guest_id / order_code masked (abc***xy) + secret_ref (RULE-014/H02, M6-OD-012)"
  m6_never:
    - "write QuoteSnapshot (quote_snapshot_id REFERENCES M3 price truth) or order state (order_code REFERENCES Commerce/M8; RULE-021)"
    - "rewrite history / hard-delete a measurement row (append + controlled-enrich only)"
    - "overwrite verified revenue or post-verify attribution without an adjustment record (RULE-008)"
    - "use HOLD/FAIL / LOW-confidence rows as scale evidence (RULE-009)"
    - "perform real egress while global_gateway_state=BLOCKED / production_flag=OFF (this is storage only; staged)"

