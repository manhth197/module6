    doc_locked: true
    binding: { immutability_zone: A_event_identity_write_once }

  quote_snapshot_id:
    doc_type: string
    doc_optional: true
    doc_source: "[DOC §10.1 L203] 'quote_snapshot_id: optional string'"
    doc_locked: true
    binding: { immutability_zone: A_event_identity_write_once }
    note: "REFERENCE to M3 QuoteSnapshot (price truth); M6 links only, NEVER writes QuoteSnapshot (boundary)"

