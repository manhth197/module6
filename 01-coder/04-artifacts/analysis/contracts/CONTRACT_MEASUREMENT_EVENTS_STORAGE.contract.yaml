    doc_locked: true
    binding: { immutability_zone: A_event_identity_write_once }

  campaign_id:
    doc_type: string
    doc_optional: true
    doc_source: "[DOC §10.1 L199] 'campaign_id: optional string'"
    doc_locked: true
    binding: { index: true, immutability_zone: A_event_identity_write_once }
