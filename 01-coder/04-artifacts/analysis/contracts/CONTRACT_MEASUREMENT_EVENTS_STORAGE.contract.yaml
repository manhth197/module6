# Single-contract file => root is a single mapping (parse-safe).
#
# NATURE: BINDING, NOT a schema producer. M6-CTR-001 is DRAFT_LOCKED — its 20 fields are locked verbatim
# in SPEC §10.1 (extract L191-211). This artifact binds those 20 fields to the physical storage table
# ads_measurement_events [DOC §13 L273]: keys, indexes, immutability zones. The 20 doc fields are NOT
# renamed, removed, or retyped. The single physical addition (ingested_at) carries changelog row 18.

contract_id: M6-CTR-001
name: ads_measurement_event
binds_table: ads_measurement_events                  # [DOC §13 L273] plural table; singular = its row contract (CHANGELOG row 1)
kind: STORAGE_BINDING                                 # not a producer; fields already DRAFT_LOCKED in SPEC §10.1
schema_version: GFD-M6-CTR-001-STORAGE-BINDING-001    # pack label; not owner content
ownership: M6                                         # M6 owns & writes the normalized measurement store
status_lock: >
  DRAFT_LOCKED (SPEC §10.1). This binding does NOT redefine the schema: all 20 fields are reproduced
  verbatim (name / type / optionality) from the owner document; only physical storage semantics
  (PK, UNIQUE, indexes, immutability zones) are added, plus one clearly-marked physical column.
written_by: >
  runtime/normalizer INSERTs a row (Zone A fixed at insert); named enrichment workers UPDATE only their
  zone (attribution_materializer M6-CTR-023 -> Zone B; data_quality_checker M6-CTR-024 -> Zone C).
read_by: Module 6 (dashboard/ROAS query layer M6-CTR-015/018, evidence pack M6-CTR-025, audit)

status_summary:
  kind: STORAGE_BINDING_DEFINED
  note: >
    The normalized event store that serves dashboard/ROAS [DOC §13 L273 'Event đã chuẩn hóa phục vụ
    dashboard/ROAS']. Rows are appended and then ENRICHED in place by named workers under locked rules;
    the event-identity facts are write-once (no history rewrite), verified revenue/attribution is
    set-once and never silently overwritten (RULE-003/008), and data_quality_status has an audited
    PASS|HOLD|FAIL lifecycle (RULE-009). This is NOT a wholesale append-only-immutable table (that would
    contradict enrichment) and NOT freely mutable (that would break RULE-003/007/008).

source:
  doc_anchor_contract: "[DOC §10.1 extract L191-211] ads_measurement_event — 20 fields, DRAFT_LOCKED (verbatim below)"
  doc_anchor_table: "[DOC §13 L273] 'ads_measurement_events | Event đã chuẩn hóa phục vụ dashboard/ROAS | Module 6'"
  changelog_observation: "[SCHEMA_CHANGELOG row 1] doc singular contract = row of plural table; pack performs NO rename"
  rule_anchors:
    - "[REG RULE-001] event_code must be an ACTIVE event in event_registry (M6-CTR-003) — registry gate (enforced upstream at ingest)"
    - "[REG RULE-002] consent fail-closed; consent_snapshot_id references M6-CTR-006 (guest_marketing_consent_snapshot)"
    - "[REG RULE-003] revenue_value ONLY from ORDER_VERIFIED (Commerce Verified Revenue only, L256)"
    - "[REG RULE-005] idempotency_key = event_code + page_id + session_id + raw_event_hash + normalized_ts (LOCKED); UNIQUE guard here (SMK-003)"
    - "[REG RULE-006] identity resolution/stitching recorded in the identity-mapping layer with audit — NOT by mutating a historical measurement row"
    - "[REG RULE-008] attribution snapshot immutable after order verified; every correction has an adjustment record {actor, reason, audit, evidence} (L242)"
    - "[REG RULE-009] LOW/HOLD/FAIL rows never used as scale evidence (L240)"
    - "[REG RULE-014 / H02] no raw PII in logs/evidence; mask abc***xy + secret_ref (M6-OD-012)"
    - "[REG RULE-021] Commerce owns order-capture validity; order_code is a REFERENCE, M6 never writes order state"

# ---------------------------------------------------------------------------
# The 20 DRAFT_LOCKED doc fields — reproduced VERBATIM (doc_locked: true), each with its physical binding.
# doc_type / doc_optional are exactly as in extract L191-211. immutability_zone/key/index are the [PACK] binding.
# ---------------------------------------------------------------------------
row_contract_doc_locked:

  event_id:
    doc_type: string
    doc_optional: false
    doc_source: "[DOC §10.1 L192] 'event_id: string'"
    doc_locked: true
    binding: { key: PRIMARY_KEY, immutability_zone: A_event_identity_write_once }

  event_code:
    doc_type: string
