      from business event_ts). NO doc field renamed, removed, or retyped; currency=VND and
      data_quality_status=[PASS|HOLD|FAIL] preserved verbatim.
    kind: "ADDITION (HARDENING — OWNER REVIEW): binding semantics + 1 physical column"
    authorized_by: "M6-P0707 (proposal; owner ratifies)"
    notes: "follows rows 9-17 (M6-P0701..0706); renumber sequentially at apply time. No rename. ingested_at may be rejected by owner if a single event_ts is preferred — the 20 doc fields stand regardless."

