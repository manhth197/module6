    date: "2026-07-22"
    artifact: "M6-CTR-013 ads_scale_request (M6-owned, M6-P0709)"
    change_vs_doc: >
      New field-level definition from doc §16 (L312-324). The 8 gate conditions (P3/P5/P6 evidence, Quote/Order,
      Public/Privacy, Funnel, Dashboard, Quality, Risk, Approval) with their 'Yêu cầu tối thiểu' are preserved
      VERBATIM as gate_conditions. [PACK] additions: request record shape (request_id, scale_scope [4 doc-named
      actions], target_ref, proposed_change, gate_evidence, budget_cap, rollback_condition, risk_bound,
      approval_ref, requested_by/at, status). No owner value invented: CPA/ROAS/verified-rate thresholds =
      M6-OD-002; 'AOV tối thiểu 2 hộp/đơn' is doc-stated; budget_cap value owner-provided. Module 6 proposes
      only (RULE-010).
    kind: "ADDITION (HARDENING — OWNER REVIEW)"
    authorized_by: "M6-P0709 (proposal; owner ratifies)"
    notes: "follows rows 9-19 (M6-P0701..0708); renumber sequentially at apply time. No rename."
  - row: 21
    date: "2026-07-22"
    artifact: "M6-CTR-026 scale_gate_approval_flow (M6 + Owner, M6-P0709)"
    change_vs_doc: >
      New field-level definition of the approval flow (CONTRACT_REGISTER L42: request -> owner approve/reject ->
      budget cap -> rollback condition) from doc §16 L312/L324. [PACK] additions: approval_id, request_ref,
      approval_state [PENDING|APPROVED|REJECTED], owner_decision {actor,decision,reason,decided_at,evidence_ref},
      budget_cap, rollback_condition, risk_veto, decided_at. Invariants: Scale Gate is owner's decision; Module 6
      never self-approves (RULE-015) or executes (RULE-010); APPROVED requires all conditions MET + budget_cap +
      rollback + risk_veto=false. No owner value invented.
    kind: "ADDITION (HARDENING — OWNER REVIEW)"
    authorized_by: "M6-P0709 (proposal; owner ratifies)"
    notes: "follows row 20; renumber sequentially at apply time. No rename. Thresholds M6-OD-002; safe-range publish M6-OD-006."

open_decisions:
  - id: M6-OD-002
    status: OPEN
    effect: "official per-stage CPA/ROAS/AOV/Verified-Rate thresholds (Funnel + Dashboard conditions). 'AOV tối thiểu 2 hộp/đơn' is the doc floor; OD-002 ratifies/adjusts per-stage numbers. Until decided, Funnel/Dashboard pass on the doc-stated conditions + owner-set thresholds, never invented numbers"
  - id: M6-OD-006
    status: OPEN
    effect: "safe range for guarded auto-publish (OPTIMIZATION_PUBLISH scope); publish stays framework-only until decided (RULE-011)"
  - id: M6-OD-012
    status: OPEN
    effect: "masking format for identity-derived target_ref / evidence refs (abc***xy recommended)"
  - id: M6-OD-011
    status: OPEN
    effect: "target repository/stack; storage engine for the request + approval records depends on the chosen stack"
  - id: M6-ENTRY-001
    status: OPEN
    effect: "P3 Verified Revenue boundary evidence (Module 3) — Scale Gate blocked until filed (fail-closed)"
  - id: M6-ENTRY-002
    status: OPEN
    effect: "P5 channel identity evidence (Module 5) — Scale Gate blocked until filed"
  - id: M6-ENTRY-003
    status: OPEN
    effect: "P6 event identity / event_registry evidence (Core) — Scale Gate blocked until filed"
  - id: M6-ENTRY-004
    status: OPEN
    effect: "Public/privacy conduct evidence (Module 4 + Module 5) — Scale Gate blocked until filed"

acceptance_self_map:
  - "M6-CTR-013 and M6-CTR-026 defined field-level with types + constraints (request shape + 8 verbatim gate conditions; approval flow + states)"
  - "doc-named content preserved verbatim (8 §16 'Yêu cầu tối thiểu' rows, owner-decision header, Approval row); every [PACK] addition -> changelog rows 20/21"
  - "open owner decisions referenced as parameters (M6-OD-002 thresholds, M6-OD-006 safe-range, M6-OD-012 masking, M6-OD-011 stack, M6-ENTRY-001..004 entry evidence); NO threshold/budget value invented; 'AOV 2 hộp/đơn' doc-stated"
  - "Module 6 proposes, owner decides and executes (RULE-010/015, §16 L312); Risk hard veto (RULE-017); staged BLOCKED/OFF"
