  - "doc-named content preserved verbatim (all 4 worker duties + notes); every [PACK] addition -> changelog rows 28/29/30/31"
  - "open owner decisions referenced as parameters (M6-OD-003 hash, M6-OD-004 connector, M6-OD-005 attribution model, M6-OD-012 masking, M6-OD-011 stack); dedup/idempotency = LOCKED formulas; NO owner value invented (max_retries=config)"
