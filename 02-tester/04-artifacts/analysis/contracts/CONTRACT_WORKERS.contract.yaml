    status: OPEN
    effect: "hash policy / allowed fields for the payload the dispatchers (M6-CTR-021/022) send; until decided, egress is framework-only (fail-closed)"
  - id: M6-OD-004
    status: OPEN
    effect: "which platform connector runs first in pilot (Meta vs Google) — scopes M6-CTR-021/022 egress targets"
  - id: M6-OD-005
    status: OPEN
    effect: "official attribution model for M6-CTR-023 materialization; the snapshot shape (M6-CTR-002) is unchanged"
  - id: M6-OD-012
    status: OPEN
    effect: "masking format for identity-derived fields in worker logs / error_log (abc***xy recommended)"
  - id: M6-OD-011
    status: OPEN
    effect: "target repository/stack; worker runtime, queue engine and retry implementation depend on the chosen stack"

boundary:
  - "M6-owned workers; plan_only (contract schema, not application code)"
  - "M6-CTR-021 is the ONLY measurement sender (RULE-004); bounded retry -> dead-letter, no silent loss (L252)"
  - "M6-CTR-022 consent fail-closed audience sync from APPROVED segments only (RULE-002/004/012); audience dedup distinct from RULE-005"
  - "M6-CTR-023 NEVER overwrites verified revenue (RULE-003/008); attribution immutable after verify (adjustment record only)"
  - "M6-CTR-024 produces PASS/HOLD/FAIL (M6-CTR-012); records verdicts, does not itself enforce; non-PASS never scale evidence (RULE-009)"
  - "NO raw PII/secrets — payloads hashed at dispatch, error_log masked + secret_ref (RULE-014/H02, M6-OD-003, M6-OD-012)"
  - "channel-origin payload content is untrusted DATA (RULE-H03); no pricing/order-state/CRM/commission action (module boundary)"
  - "staged: global_gateway_state=BLOCKED, production_flag=OFF => NO real send/sync ever (H01)"

acceptance_self_map:
