# CONTRACT_WORKERS — M6-CTR-021 measurement dispatcher + M6-CTR-022 audience dispatcher
#                   + M6-CTR-023 attribution materializer + M6-CTR-024 data quality checker
# Prompt: M6-P0713 · Phase: CONTRACT_HARMONIZATION · Mode: plan_only (schema definition; no code/migration)
# FOUR contracts => nested under a top-level 'contracts:' key so the root is a SINGLE mapping (parse-safe).
#
# The four Module-6 workers [DOC §19 L376-379]. Each duty (Mục đích) + note (Ghi chú) is preserved verbatim;
# input/output/retry/idempotency/forbidden are [PACK], anchored to already-defined records (CTR-008/011/002/
# 001/007/012/013) — no field re-invention. These workers are the ENFORCEMENT points for the band's
# invariants: CTR-021 is the ONLY measurement sender (RULE-004); CTR-022 is consent-fail-closed audience sync;
# CTR-023 NEVER overwrites verified revenue (RULE-008); CTR-024 produces the PASS/HOLD/FAIL verdicts (CTR-012).

contracts:

  # =========================================================================
  # M6-CTR-021 marketing_measurement_dispatcher — the ONLY measurement sender
  # =========================================================================
  - contract_id: M6-CTR-021
    name: "worker: marketing_measurement_dispatcher"
    kind: OWNED_SHAPE_DEFINED
    schema_version: GFD-M6-CTR-021-OWNED-001
    ownership: M6
    doc_duty: "Gửi Pixel/CAPI/Offline"                                   # [DOC §19 L376] verbatim
    doc_note: "Retry, dedup, error log"                                  # [DOC §19 L376] verbatim
    doc_verbatim: true

    source:
      doc_anchor: "[DOC §19 L376] 'worker: marketing_measurement_dispatcher | Gửi Pixel/CAPI/Offline | Retry, dedup, error log'"
      rule_anchors:
        - "[REG RULE-004] the ONLY path for external measurement — runtime never sends"
        - "[REG RULE-005] dedup_key unique => no double send/count (SMK-003)"
        - "[REG RULE-002] consent re-validated at send (fail-closed)"
        - "[REG RULE-014 / H02] payload hashed at dispatch (M6-OD-003); no raw PII"

    input:
      source_contract: "M6-CTR-008 marketing_measurement_outbox"
      selection: "rows with status in {QUEUED, RETRY} and next_retry_at due"
    output:
      effect: "evaluate send_policy, egress to Pixel/CAPI/Offline, transition outbox status QUEUED->SENT | RETRY -> DEAD_LETTER; append error_log / set next_retry_at on failure (M6-CTR-008)"
      send_policy_at_dispatch: "consent_valid AND event_in_registry AND data_quality_pass AND not_duplicate [DOC §12 L257]"
    retry_dead_letter:
      policy: "bounded retry — on failure append error_log + set next_retry_at + increment retry_count; when retry_count >= max_retries => DEAD_LETTER (M6-CTR-008)"
      guarantee: "NO infinite retry, NO silent loss (doc L252, SMK-016); max_retries VALUE = config, not invented"
    idempotency:
      key: "dedup_key (LOCKED RULE-005: platform + event_code + customer_or_guest_key + event_ts_bucket + source_event_id), UNIQUE on the outbox => one send per (conversion x platform); idempotency_key carried for platform-side dedup"
      behavior: "at-most-once external send; a duplicate is not re-sent (no double count)"
    forbidden_actions:
      - "external send from anywhere but this worker (RULE-004)"
      - "sending without valid consent — consent RE-VALIDATED at dispatch; missing/expired/opt-out => NO send (RULE-002 fail-closed, doc §12 L248 'Không gửi khi consent missing')"
      - "infinite retry / losing an event without a trace (doc L252)"
      - "sending raw PII — payload is hashed at dispatch (M6-OD-003, RULE-014/H02)"
      - "sending Offline before ORDER_VERIFIED or owner approval (doc §12 L250)"
      - "sending while global_gateway_state=BLOCKED / production_flag=OFF (staged; H01) => NO real send ever"

  # =========================================================================
  # M6-CTR-022 marketing_audience_dispatcher — consent-fail-closed audience sync
  # =========================================================================
  - contract_id: M6-CTR-022
    name: "worker: marketing_audience_dispatcher"
    kind: OWNED_SHAPE_DEFINED
    schema_version: GFD-M6-CTR-022-OWNED-001
    ownership: M6
    doc_duty: "Sync audience"                                            # [DOC §19 L377] verbatim
    doc_note: "Consent fail-closed"                                      # [DOC §19 L377] verbatim
    doc_verbatim: true

    source:
      doc_anchor: "[DOC §19 L377] 'worker: marketing_audience_dispatcher | Sync audience | Consent fail-closed'"
      rule_anchors:
        - "[REG RULE-002] consent fail-closed — opt-out => not synced / REMOVE (SMK-008)"
        - "[REG RULE-004] audience only from APPROVED customer_segments + outbox; never direct"
        - "[REG RULE-012] segment membership is never a trigger owner"

    input:
      source_contract: "M6-CTR-011 marketing_audience_outbox"
      selection: "rows with status in {QUEUED, RETRY}; only from APPROVED customer_segments (M6-CTR-009) with consent pass [DOC §12 L251]"
    output:
      effect: "sync audience ADD/REMOVE to the platform (META_AUDIENCE / GOOGLE_AUDIENCE, M6-OD-004); transition audience_outbox status; error_log / next_retry_at on failure (M6-CTR-011)"
    retry_dead_letter:
      policy: "bounded retry -> DEAD_LETTER (mirrors M6-CTR-011); error_log + next_retry_at"
      guarantee: "no infinite retry, no silent loss; max_retries = config, not invented"
    idempotency:
      key: "audience dedup_key (M6-CTR-011: segment_id + member_key + platform + operation) — DISTINCT from the RULE-005 measurement formula"
      behavior: "at-most-once ADD/REMOVE per (segment, member, platform, operation); duplicate not re-synced"
    forbidden_actions:
      - "syncing without valid consent — consent RE-VALIDATED at send; opt-out => REMOVE / not synced (RULE-002 fail-closed, SMK-008)"
      - "syncing from an ad-hoc query or data mart (only from APPROVED customer_segments + outbox + consent, doc §12 L251)"
      - "using segment membership as a trigger for any CRM/pricing/Diamond/scale action (RULE-012)"
      - "sending raw PII — payload hashed/PII-safe at dispatch (M6-OD-003, RULE-014/H02)"
      - "syncing while global_gateway_state=BLOCKED / production_flag=OFF (staged; H01) => NO real sync ever"

  # =========================================================================
  # M6-CTR-023 attribution_materializer — NEVER overwrites verified revenue
  # =========================================================================
  - contract_id: M6-CTR-023
    name: "worker: attribution_materializer"
    kind: OWNED_SHAPE_DEFINED
    schema_version: GFD-M6-CTR-023-OWNED-001
    ownership: M6
    doc_duty: "Tổng hợp attribution snapshots"                           # [DOC §19 L378] verbatim
    doc_note: "Không ghi đè verified revenue"                            # [DOC §19 L378] verbatim — the load-bearing forbidden action
    doc_verbatim: true

    source:
      doc_anchor: "[DOC §19 L378] 'worker: attribution_materializer | Tổng hợp attribution snapshots | Không ghi đè verified revenue'"
      rule_anchors:
        - "[REG RULE-008] attribution snapshot IMMUTABLE after order verified; correction => adjustment record {actor, reason, audit, evidence}"
        - "[REG RULE-003] verified revenue = ORDER_VERIFIED only — NEVER recomputed/overwritten by attribution"
        - "[REG RULE-009] LOW-confidence / conflict => HOLD, not scale evidence"

    input:
      source_contract: "M6-CTR-001 ads_measurement_event + M6-CTR-007 conversion_events + M6-CTR-002 ads_attribution_context"
      selection: "events/conversions needing attribution materialization"
    output:
      effect: "materialize the attribution snapshot (M6-CTR-002) and write attribution_context into ads_measurement_event Zone B (M6-CTR-001); mark source_confidence / conflict_status (M6-CTR-002)"
    retry_dead_letter:
      policy: "idempotent recompute; bounded retry on transient failure -> DEAD_LETTER; error_log"
      guarantee: "no infinite retry; recompute is deterministic (no duplicate snapshot)"
    idempotency:
      key: "deterministic materialization keyed by event/conversion identity; re-running yields the same snapshot (no duplicate)"
      behavior: "idempotent — safe to re-materialize; NEVER mutates an already-verified value"
    forbidden_actions:
      - "OVERWRITING verified revenue (doc L378 'Không ghi đè verified revenue'; RULE-003) — verified revenue is ORDER_VERIFIED-sourced and set-once (M6-CTR-001 Zone B, M6-CTR-023 duty)"
      - "mutating an attribution snapshot after order verified WITHOUT an adjustment record {actor, reason, audit, evidence} (RULE-008)"
      - "using LOW-confidence / conflict attribution as scale evidence (mark HOLD/LOW, RULE-009)"
      - "any order-state / pricing / CRM / commission action (module boundary)"

  # =========================================================================
  # M6-CTR-024 data_quality_checker — produces PASS/HOLD/FAIL
  # =========================================================================
  - contract_id: M6-CTR-024
    name: "worker: data_quality_checker"
    kind: OWNED_SHAPE_DEFINED
    schema_version: GFD-M6-CTR-024-OWNED-001
    ownership: M6
    doc_duty: "Kiểm data quality và scale readiness"                     # [DOC §19 L379] verbatim
    doc_note: "Output PASS/HOLD/FAIL"                                    # [DOC §19 L379] verbatim
    doc_verbatim: true

    source:
      doc_anchor: "[DOC §19 L379] 'worker: data_quality_checker | Kiểm data quality và scale readiness | Output PASS/HOLD/FAIL'"
      rule_anchors:
        - "[CTR-012] ads_data_quality_check — the 8 §15 gate items; this worker is its producer"
        - "[REG RULE-009] non-PASS subjects never used as scale evidence"

    input:
      source_contract: "M6-CTR-001 ads_measurement_event / M6-CTR-007 conversion_events / dashboard metrics (M6-CTR-018) / scale requests (M6-CTR-013)"
      selection: "subjects needing a Data Quality Gate verdict (the applicable §15 gate items per subject)"
    output:
      effect: "write ads_data_quality_check rows (M6-CTR-012) with status PASS/HOLD/FAIL per gate item; set data_quality_status on ads_measurement_event Zone C (M6-CTR-001); compute scale readiness (feeds M6-CTR-013 gate_evidence)"
      aggregate: "per-subject data_quality_status = worst-of applicable gate items (FAIL > HOLD > PASS)"
    retry_dead_letter:
      policy: "idempotent re-check; bounded retry on transient failure -> DEAD_LETTER; error_log"
      guarantee: "no infinite retry; re-check is deterministic"
    idempotency:
      key: "deterministic check keyed by (subject, gate_item); re-running yields the same verdict"
      behavior: "idempotent — safe to re-check"
    forbidden_actions:
      - "acting as an enforcement gate itself — it RECORDS verdicts; consent/registry/dedup are enforced at their own checkpoints (M6-CTR-012 boundary)"
      - "marking a non-PASS subject as usable scale evidence (RULE-009)"
      - "inventing a per-item HOLD-vs-FAIL owner value (severity derived from locked rules; M6-CTR-012)"
      - "triggering any owner/CRM/scale action (support/measure only)"

