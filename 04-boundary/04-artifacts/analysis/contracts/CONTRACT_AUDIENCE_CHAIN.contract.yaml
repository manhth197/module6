  - row: 17
    date: "2026-07-22"
    artifact: "M6-CTR-011 marketing_audience_outbox (M6 worker-only, M6-P0706)"
    change_vs_doc: >
      M6-owned shape from §13 L271 + chain §7 L120 + §12 L251. [PACK] fields incl. platform [META/GOOGLE_AUDIENCE]
