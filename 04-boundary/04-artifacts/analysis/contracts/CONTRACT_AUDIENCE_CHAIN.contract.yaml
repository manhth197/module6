    kind: "ADDITION (HARDENING — OWNER/CRM REVIEW)"
    authorized_by: "M6-P0706 (proposal; CRM owner ratifies)"
    notes: "consumed; authoritative schema is CRM/Ads segmentation's. No rename."
  - row: 16
    date: "2026-07-22"
    artifact: "M6-CTR-010 customer_segment_members (consumed shape, M6-P0706)"
    change_vs_doc: "Consumed shape from §13 L270. [PACK] fields; member_key PII-masked; consent-gated. LOAD-BEARING: membership is read for sync ONLY, NEVER a trigger owner (RULE-012, L270). No owner value invented."
    kind: "ADDITION (HARDENING — OWNER/CRM REVIEW)"
    authorized_by: "M6-P0706 (proposal; CRM owner ratifies)"
