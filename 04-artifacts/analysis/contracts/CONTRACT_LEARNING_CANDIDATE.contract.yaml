  - row: 22
    date: "2026-07-22"
    artifact: "M6-CTR-014 ads_learning_candidate (M6-owned, M6-P0710)"
    change_vs_doc: >
      New field-level definition from doc §17 (L326-353) + object anchor L276. Doc-named content preserved
      verbatim: candidate_type [KEYWORD|PERSONA|HOOK|CREATIVE|LANDING|CTA] (L276), output_kind
      [CANDIDATE|DELTA_RECOMMENDATION|SAFE_RANGE_OPTIMIZATION] (L332), the 5 lifecycle stages (L349-353), the 6
      seed libraries (L338-345). [PACK] additions: record shape (candidate_id, sellable_sku_ref, mapping_ref,
      seed_provenance, signal_basis, score, proposed_delta, safe_range, review_state [PENDING|APPROVED|REJECTED|
      HOLD] L352, reviewed_by/at/reason, publish_state [NOT_PUBLISHED|GUARDED_PUBLISHED|ROLLED_BACK] L353,
      rollback_condition, audit_ref, created_at) + guardrails. No owner value invented: safe_range values =
      M6-OD-006; content fill = M6-OD-007; sellable set = M6-OD-001. Guarded learning (RULE-011); no full
      auto-publish / no fabricated origin (LEX-006).
    kind: "ADDITION (HARDENING — OWNER REVIEW)"
    authorized_by: "M6-P0710 (proposal; owner ratifies)"
    notes: "follows rows 9-21 (M6-P0701..0709); renumber sequentially at apply time. No rename."

