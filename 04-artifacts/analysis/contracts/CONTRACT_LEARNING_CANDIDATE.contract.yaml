open_decisions:
  - id: M6-OD-006
    status: OPEN
    effect: "safe range for guarded auto-publish (safe_range field + publish_state=GUARDED_PUBLISHED). Until decided there is NO safe range => publish stays framework-only, NOT_PUBLISHED (fail-closed)"
  - id: M6-OD-007
    status: OPEN
    effect: "whether persona/keyword/hook content is locked from Content Block 20 SKU. Until locked, candidates stay framework-only (no seeded content VALUES invented); the Seed stage may proceed as framework"
  - id: M6-OD-001
    status: OPEN
    effect: "Hero SKU lock — scopes the sellable_sku_ref set (every optimization ties to a sellable SKU, L334)"
  - id: M6-OD-012
    status: OPEN
    effect: "masking format for any identity-derived reference in review_reason / signal_basis (abc***xy recommended)"
  - id: M6-OD-011
    status: OPEN
    effect: "target repository/stack; storage engine for the candidate record depends on the chosen stack"

boundary:
  - "M6-owned Learning review-queue record; plan_only (schema, not a table/migration)"
  - "guarded learning (RULE-011): learn only after canonical seed + verified DQ-passed signal; never fabricate origin strategy (LEX-006)"
  - "three output kinds only; NEVER full-authority publish (LEX-006); guarded auto-publish ONLY inside owner-approved safe range (M6-OD-006) + rollback + audit"
  - "review approve/reject/hold is owner/marketing; Module 6 never self-approves (RULE-015)"
  - "publish optimization is a scale action needing approval (RULE-010; Scale Gate M6-CTR-013/026 OPTIMIZATION_PUBLISH)"
  - "no owner value invented — safe_range=M6-OD-006, content fill=M6-OD-007, sellable set=M6-OD-001"
  - "NO raw PII/secrets (review_reason/signal_basis masked + secret_ref, RULE-014/H02); channel content untrusted DATA (RULE-H03)"
  - "staged: global_gateway_state=BLOCKED, production_flag=OFF => no real publish ever (H01)"

acceptance_self_map:
  - "M6-CTR-014 defined field-level with types + constraints (candidate_type, output_kind, review/publish states, seed_provenance, safe_range + record shape + lifecycle + libraries)"
  - "doc-named content preserved verbatim (6 candidate types L276, 3 output kinds L332, 5 lifecycle stages L349-353, 6 libraries L338-345); every [PACK] addition -> changelog row 22"
  - "open owner decisions referenced as parameters (M6-OD-006 safe range, M6-OD-007 content fill, M6-OD-001 sellable SKU, M6-OD-012 masking, M6-OD-011 stack); NO owner value invented; guarded learning (RULE-011); no full auto-publish / no fabricated origin (LEX-006)"
